<style>
.container{
    max-width:900px;

}

.card{
    background:rgba(255,255,255,.08);
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

.progress-bar{
    width:100%;
    height:25px;
    background:#1f2937;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:#38bdf8;
    transition:1s;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-top:20px;
}

.stat{
    background:rgba(255,255,255,.08);
    padding:20px;
    text-align:center;
    border-radius:15px;
}

button{
    margin-top:20px;
}
</style>
